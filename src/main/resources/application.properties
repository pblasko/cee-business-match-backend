spring.application.name=business-match-backend

server.port=${SERVER_PORT:8001}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/business_match?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:MySuperSecretKeyForJwtTokenGenerationThatIsLongEnough123456}
jwt.expiration=${JWT_EXPIRATION:86400000}
